<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1d6452">
  <meta name="description" content="O novo site da Bento &amp; Co. está em construção. Estamos preparando um novo espaço para receber você. Em breve, por aqui.">
  <title>Bento &amp; Co. | Em breve</title>
  <style>
    :root { color-scheme: light; --green: #1d6452; --cream: #faf7ee; --muted: #d0dfd6; }
    * { box-sizing: border-box; }
    html { min-height: 100%; background: var(--green); }
    body { margin: 0; color: var(--cream); font-family: Arial, Helvetica, sans-serif; -webkit-font-smoothing: antialiased; }
    .page { min-height: 100svh; display: flex; flex-direction: column; overflow: hidden; position: relative; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 24px; padding: 35px clamp(24px, 5vw, 80px); z-index: 1; }
    .logo { width: clamp(150px, 17vw, 215px); height: auto; display: block; }
    .edition { font-size: 10px; letter-spacing: .19em; text-transform: uppercase; opacity: .75; }
    main { flex: 1; display: grid; place-items: center; position: relative; padding: 72px 24px 95px; text-align: center; }
    .content { position: relative; z-index: 1; max-width: 960px; }
    .status { display: inline-flex; align-items: center; gap: 10px; border: 1px solid #faf7ee45; border-radius: 30px; padding: 11px 17px; font-size: 10px; letter-spacing: .17em; text-transform: uppercase; }
    .dot { width: 6px; height: 6px; border-radius: 50%; background: #d4dfab; box-shadow: 0 0 0 4px #d4dfab12; }
    h1 { margin: 35px 0 24px; font-family: Georgia, 'Times New Roman', serif; font-size: clamp(46px, 6.8vw, 92px); line-height: 1.08; font-weight: 400; letter-spacing: -.045em; }
    h1 em { font-weight: 400; color: #dfdfbd; }
    .description { margin: 0 auto; max-width: 390px; color: var(--muted); font-size: 15px; line-height: 1.8; }
    .soon { margin: 40px 0 0; display: inline-flex; align-items: center; gap: 16px; font-size: 11px; text-transform: uppercase; letter-spacing: .2em; }
    .soon::before, .soon::after { content: ''; width: 34px; height: 1px; background: #faf7ee50; }
    .orbit { pointer-events: none; position: absolute; width: 520px; height: 720px; border: 1px solid #faf7ee12; border-radius: 50%; transform: rotate(35deg); }
    .orbit.left { left: -430px; top: -110px; }
    .orbit.right { right: -430px; bottom: -160px; }
    footer { background: var(--cream); color: var(--green); display: flex; align-items: center; justify-content: space-between; gap: 20px; padding: 25px clamp(24px, 5vw, 80px); font-size: 11px; }
    .footer-note { font-family: Georgia, 'Times New Roman', serif; font-style: italic; font-size: 18px; }
    .copyright { opacity: .75; text-align: right; line-height: 1.6; }
    @media (max-width: 600px) {
      header { padding-top: 27px; }
      .edition { display: none; }
      main { padding-top: 62px; padding-bottom: 74px; }
      h1 { margin-top: 30px; }
      .description { max-width: 290px; font-size: 14px; }
      footer { align-items: flex-start; flex-direction: column; gap: 12px; }
      .copyright { text-align: left; font-size: 10px; }
    }
  </style>
</head>
